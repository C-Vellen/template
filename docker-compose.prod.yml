services:
  web:
    build:
      context: .
      target: production   
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/staticfiles
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn src.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - static_files:/staticfiles      # même volume
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  static_files: